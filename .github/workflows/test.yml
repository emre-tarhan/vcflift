name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - name: Test and vet core packages
        run: |
          go test ./internal/... ./cmd/vcflift-cli
          go vet ./internal/... ./cmd/vcflift-cli

  gui-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - name: Install Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Resolve Go modules
        run: go mod download
      - name: Compile GUI
        run: go build -trimpath -o /tmp/VCFLift ./cmd/vcflift

  gui-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Resolve Go modules and compile GUI
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          go mod download
          go build -trimpath -ldflags="-H windowsgui" -o $env:RUNNER_TEMP\VCFLift.exe ./cmd/vcflift
